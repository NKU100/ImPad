name: Check WeChat compatibility

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Validate the requested candidate or adapt it when incompatible
        type: choice
        required: true
        default: verify
        options:
          - verify
          - adapt
      apk_url:
        description: Exact official WeChat APK URL; empty uses official discovery
        type: string
        default: ''
      force_recheck:
        description: Run static regression even when the exact APK is already supported
        type: boolean
        default: false
      run_codex:
        description: Adapt verified unknown builds with gpt-6-luna/xhigh
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility-app.yml
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      app_id: wechat
      operation: ${{ github.event_name == 'schedule' && 'adapt' || inputs.operation || 'verify' }}
      apk_url: ${{ inputs.apk_url || '' }}
      force_recheck: ${{ inputs.force_recheck || false }}
      run_codex: ${{ github.event_name == 'schedule' || inputs.run_codex }}
    secrets: inherit
