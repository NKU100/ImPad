name: Validate ImPad runtime

on:
  workflow_dispatch:
    inputs:
      rebuild_ramdisk:
        description: Rebuild pinned ramdisk from official inputs and verify byte-for-byte reproduction
        type: boolean
        default: false
      app_id:
        description: Registered application policy to replay
        type: string
        default: wechat
      candidate_mode:
        description: Select the latest official APK or the newest runtime-verified registered APK
        type: choice
        options:
          - latest
          - registered
        default: latest
      apk_sha256:
        description: Select an exact runtime-verified profile when registered variants share the latest version
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_id: ${{ steps.policy.outputs.app_id }}
      targets_path: ${{ steps.policy.outputs.targets_path }}
      artifact_prefix: ${{ steps.policy.outputs.artifact_prefix }}
    env:
      APP_ID: ${{ inputs.app_id || 'wechat' }}
      CANDIDATE_MODE: ${{ inputs.candidate_mode || 'latest' }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve trusted application policy
        id: policy
        run: python3 -m scripts.ci.app_policy --app-id "$APP_ID" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install module SDK
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - name: Prepare registered replay candidate and app-scoped module assets
        run: |
          selector_args=()
          if [[ -n "$APK_SHA256" ]]; then
            if [[ ! "$APK_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
              echo 'apk_sha256 must be 64 hexadecimal characters' >&2
              exit 2
            fi
            selector_args=(--apk-sha256 "$APK_SHA256")
          fi
          python3 -m scripts.ci.candidate_selection \
            --app-id "$APP_ID" \
            --mode "$CANDIDATE_MODE" \
            --targets "$TARGETS_PATH" \
            "${selector_args[@]}" \
            --directory runtime-inputs
      - name: Check real APK and build replay module
        run: |
          expected_sha256="$(jq -r .identity.apkSha256 runtime-inputs/candidate-report.json)"
          ./gradlew --no-daemon :compat-checker:run --args="check --app-id $APP_ID --targets $TARGETS_PATH --apk runtime-inputs/$APP_ID-$expected_sha256.apk"
          ./gradlew --no-daemon -PruntimeLocalAssets=runtime-inputs :app:assembleDebug :app:verifyModuleMetadata
          cp app/build/outputs/apk/debug/app-debug.apk runtime-inputs/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.policy.outputs.artifact_prefix }}-${{ steps.policy.outputs.app_id }}-adapted-module
          path: runtime-inputs/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.policy.outputs.artifact_prefix }}-${{ steps.policy.outputs.app_id }}-runtime-candidate
          path: |
            runtime-inputs/${{ inputs.app_id || 'wechat' }}-*.apk
            runtime-inputs/candidate-report.json
          retention-days: 7

  runtime:
    needs: prepare
    uses: ./.github/workflows/runtime-smoke.yml
    with:
      app_id: ${{ inputs.app_id || 'wechat' }}
      module_run_id: ${{ github.run_id }}
      module_artifact: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-adapted-module
      candidate_artifact: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-candidate
      rebuild_ramdisk: ${{ inputs.rebuild_ramdisk }}

  result:
    needs: [prepare, runtime]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-candidate
          path: runtime-result
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-smoke
          path: runtime-result/evidence
      - name: Validate pipeline acceptance without publishing support
        env:
          SMOKE_CONCLUSION: ${{ needs.runtime.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.ci.runtime_task import runtime_result
          directory = Path('runtime-result')
          candidate = json.loads((directory / 'candidate-report.json').read_text())
          evidence = directory / 'evidence/runtime-smoke/evidence/smoke-report.json'
          smoke = json.loads(evidence.read_text()) if evidence.is_file() else {}
          report = runtime_result(candidate, smoke, os.environ['SMOKE_CONCLUSION'], os.environ['APP_ID'])
          (directory / 'runtime-candidate-report.json').write_text(json.dumps(report, indent=2) + '\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              identity = candidate['identity']
              summary.write(f'## Replay result\n\n`{report["status"]}`\n\n')
              summary.write(f'selectedMode: `{candidate["selectionMode"]}`\n\n')
              summary.write(f'Candidate: `{identity["versionName"]}` (`{identity["versionCode"]}`), APK SHA-256 `{identity["apkSha256"]}`\n\n')
              summary.write('No Codex invocation, PR or formal support update.\n')
          assert report['status'] == 'RUNTIME_VERIFIED', report
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-result
          path: runtime-result/runtime-candidate-report.json
          retention-days: 14
