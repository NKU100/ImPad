name: Validate ImPad runtime

on:
  workflow_call:
    inputs:
      app_id:
        type: string
        required: true
      operation:
        description: Candidate operation selected by the unified compatibility entry
        type: string
        required: true
      apk_url:
        description: Exact HTTPS APK or XAPK URL with trusted app signature; empty uses official discovery
        type: string
        default: ''
      candidate_mode:
        description: Use the latest official APK or recheck the exact candidate artifact produced by an earlier stage.
        type: string
        required: true
      module_run_id:
        type: string
        default: ''
      module_artifact:
        type: string
        default: ''
      candidate_artifact:
        description: Exact producer artifact containing candidate-report.json and the APK whose SHA-256 it names.
        type: string
        default: ''
      source_head:
        description: Exact source commit used to build the module artifact
        type: string
        default: ''
    outputs:
      candidate_status:
        description: Status of the exact candidate selected or received by this validation run
        value: ${{ jobs.prepare.outputs.candidate_status }}
      candidate_artifact:
        description: Artifact containing the exact candidate report and static inputs
        value: ${{ jobs.result.outputs.adaptation_artifact || format('runtime-candidate-report-input-{0}', inputs.app_id) }}
      validation_outcome:
        description: File-verified outcome including confirmed runtime incompatibility
        value: ${{ jobs.result.outputs.validation_outcome }}
      badge_outcome:
        value: ${{ jobs.result.outputs.badge_outcome || jobs.prepare.outputs.badge_outcome }}
      badge_candidate_status:
        value: ${{ jobs.result.outputs.badge_candidate_status || jobs.prepare.outputs.badge_candidate_status }}
      badge_version_name:
        value: ${{ jobs.result.outputs.badge_version_name || jobs.prepare.outputs.badge_version_name }}
      badge_version_code:
        value: ${{ jobs.result.outputs.badge_version_code || jobs.prepare.outputs.badge_version_code }}
      badge_candidate_sha256:
        value: ${{ jobs.result.outputs.badge_candidate_sha256 || jobs.prepare.outputs.badge_candidate_sha256 }}
      badge_regression_outcome:
        value: ${{ jobs.result.outputs.badge_regression_outcome || jobs.prepare.outputs.badge_regression_outcome }}
      badge_check_outcome:
        value: ${{ jobs.result.outputs.badge_check_outcome || jobs.prepare.outputs.badge_check_outcome }}
      badge_build_outcome:
        value: ${{ jobs.result.outputs.badge_build_outcome || jobs.prepare.outputs.badge_build_outcome }}
      badge_runtime_environment:
        value: ${{ jobs.result.outputs.badge_runtime_environment || jobs.prepare.outputs.badge_runtime_environment }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      app_id: ${{ steps.policy.outputs.app_id }}
      artifact_prefix: ${{ steps.policy.outputs.artifact_prefix }}
      candidate_status: ${{ steps.candidate-state.outputs.status }}
      badge_outcome: ${{ steps.badge-evidence.outputs.badge_outcome }}
      badge_candidate_status: ${{ steps.badge-evidence.outputs.badge_candidate_status }}
      badge_version_name: ${{ steps.badge-evidence.outputs.badge_version_name }}
      badge_version_code: ${{ steps.badge-evidence.outputs.badge_version_code }}
      badge_candidate_sha256: ${{ steps.badge-evidence.outputs.badge_candidate_sha256 }}
      badge_regression_outcome: ${{ steps.badge-evidence.outputs.badge_regression_outcome }}
      badge_check_outcome: ${{ steps.badge-evidence.outputs.badge_check_outcome }}
      badge_build_outcome: ${{ steps.badge-evidence.outputs.badge_build_outcome }}
      badge_runtime_environment: ${{ steps.badge-evidence.outputs.badge_runtime_environment }}
    env:
      APP_ID: ${{ inputs.app_id }}
      CANDIDATE_MODE: ${{ inputs.candidate_mode || 'latest' }}
    steps:
      - name: Validate operation and candidate artifact contract
        env:
          OPERATION: ${{ inputs.operation }}
          APK_URL: ${{ inputs.apk_url || '' }}
          MODULE_RUN_ID: ${{ inputs.module_run_id || '' }}
          MODULE_ARTIFACT: ${{ inputs.module_artifact || '' }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact || '' }}
          SOURCE_HEAD: ${{ inputs.source_head || '' }}
        run: |
          case "$OPERATION" in
            verify|adapt) ;;
            *) echo "Unsupported operation: $OPERATION" >&2; exit 2 ;;
          esac
          case "$CANDIDATE_MODE" in
            latest)
              if [[ -n "$CANDIDATE_ARTIFACT" ]]; then
                echo 'candidate_artifact requires candidate_mode=artifact' >&2
                exit 2
              fi
              ;;
            artifact)
              [[ "$MODULE_RUN_ID" =~ ^[0-9]+$ && -n "$CANDIDATE_ARTIFACT" ]] || {
                echo 'artifact mode requires module_run_id and candidate_artifact' >&2
                exit 2
              }
              [[ -z "$APK_URL" ]] || {
                echo 'artifact mode cannot also request a newly resolved APK URL' >&2
                exit 2
              }
              [[ "$SOURCE_HEAD" =~ ^[a-fA-F0-9]{40,64}$ ]] || {
                echo 'artifact mode requires the exact producer source_head' >&2
                exit 2
              }
              ;;
            *) echo "Unsupported candidate_mode: $CANDIDATE_MODE" >&2; exit 2 ;;
          esac
          if [[ -n "$MODULE_ARTIFACT" && -z "$MODULE_RUN_ID" ]]; then
            echo 'module_artifact requires module_run_id' >&2
            exit 2
          fi
          if [[ -n "$MODULE_RUN_ID" && ! "$MODULE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'module_run_id must contain only decimal digits' >&2
            exit 2
          fi

      - name: Check out trusted DexKit preparation source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-dexkit
          sparse-checkout: |
            .github/actions/prepare-dexkit-system-deps
            scripts/ci
            gradle
          persist-credentials: false
      - name: Prepare locked DexKit system dependencies
        uses: ./.trusted-dexkit/.github/actions/prepare-dexkit-system-deps
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_head || github.sha }}
      - id: policy
        run: python3 -m scripts.ci.app_policy --app-id "$APP_ID" --github-output "$GITHUB_OUTPUT"
      - id: module-artifact
        name: Resolve exact module artifact selection
        if: inputs.module_run_id != ''
        env:
          MODULE_RUN_ID: ${{ inputs.module_run_id }}
          MODULE_ARTIFACT: ${{ inputs.module_artifact || '' }}
          ARTIFACT_PREFIX: ${{ steps.policy.outputs.artifact_prefix }}
        run: |
          set -euo pipefail
          if [[ -z "$MODULE_RUN_ID" ]]; then
            printf 'name=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$MODULE_ARTIFACT" ]]; then
            artifact_name="$MODULE_ARTIFACT"
          else
            artifact_name="${ARTIFACT_PREFIX}-${APP_ID}-adapted-module"
          fi
          python3 - "$artifact_name" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          import uuid

          name, output_path = sys.argv[1:]
          if not name or any(char in name for char in ('\n', '\r')):
              raise SystemExit('module artifact name must be non-empty and single-line')
          delimiter = 'impad-' + uuid.uuid4().hex
          with Path(output_path).open('a') as output:
              output.write(f'name<<{delimiter}\n{name}\n{delimiter}\n')
          PY
      - name: Validate exact candidate artifact inputs
        if: inputs.candidate_mode == 'artifact'
        env:
          MODULE_RUN_ID: ${{ inputs.module_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
        run: |
          test -n "$MODULE_RUN_ID"
          test -n "$CANDIDATE_ARTIFACT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'cmdline-tools;latest' 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Discover official candidate URL
        id: official
        if: inputs.apk_url == '' && inputs.candidate_artifact == '' && inputs.candidate_mode != 'artifact'
        run: python3 -m scripts.ci.discover_latest_wechat --app-id "$APP_ID" --github-output "$GITHUB_OUTPUT" --report "$GITHUB_STEP_SUMMARY"
      - name: Prepare official candidate with the shared checker
        if: inputs.apk_url == '' && inputs.candidate_artifact == '' && inputs.candidate_mode != 'artifact'
        env:
          APK_URL: ${{ steps.official.outputs.source_url }}
        run: |
          test "$CANDIDATE_MODE" = latest
          python3 -m scripts.ci.candidate_selection \
            --app-id "$APP_ID" \
            --apk-url "$APK_URL" \
            --directory work/runtime-smoke
      - name: Prepare requested APK or XAPK URL
        if: inputs.apk_url != '' && inputs.candidate_artifact == '' && inputs.candidate_mode != 'artifact'
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          python3 -m scripts.ci.candidate_selection \
            --app-id "$APP_ID" \
            --apk-url "$APK_URL" \
            --directory work/runtime-smoke
      - name: Run fixed-record static regression
        run: |
          python3 -m scripts.ci.static_regression \
            --app-id "$APP_ID" \
            --reports work/runtime-smoke/regression
      - name: Reuse exact module build
        if: inputs.module_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.module-artifact.outputs.name }}
          path: work/runtime-smoke/module
          run-id: ${{ inputs.module_run_id }}
          github-token: ${{ github.token }}
      - name: Reuse statically verified candidate
        if: inputs.module_run_id != '' && inputs.candidate_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact }}
          path: work/runtime-smoke
          run-id: ${{ inputs.module_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck exact candidate artifact
        if: inputs.candidate_mode == 'artifact' && inputs.candidate_artifact != ''
        run: |
          python3 -m scripts.ci.candidate_selection \
            --app-id "$APP_ID" \
            --adaptation-report work/runtime-smoke/candidate-report.json \
            --directory work/runtime-smoke
      - name: Capture prepared candidate status
        id: candidate-state
        run: |
          status=UNAVAILABLE
          if [[ -f work/runtime-smoke/candidate-report.json ]]; then
            status="$(jq -r '.status // "UNAVAILABLE"' work/runtime-smoke/candidate-report.json)"
            if [[ "$status" == STATIC_VERIFIED_PENDING_RUNTIME ]]; then status=PREPARED; fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Build module for the exact checked candidate
        id: module-build
        if: inputs.module_run_id == '' && steps.candidate-state.outputs.status == 'PREPARED'
        run: |
          test -f work/runtime-smoke/regression/results.json
          mkdir -p work/build-badge
          rm -f work/build-badge/gradle-failures.json
          ./gradlew --no-daemon --init-script scripts/ci/gradle_failure_evidence.init.gradle \
            -PruntimeLocalAssets=work/runtime-smoke :app:assembleDebug :app:verifyModuleMetadata
          mkdir -p work/runtime-smoke/module
          cp app/build/outputs/apk/debug/app-debug.apk work/runtime-smoke/module/app-debug.apk
      - name: Stage reused module without rebuilding or changing its bytes
        if: inputs.module_run_id != '' && steps.candidate-state.outputs.status == 'PREPARED'
        run: python3 -m scripts.ci.stage_runtime_module --directory work/runtime-smoke/module
      - name: Verify signer and static rules and compile native collector
        if: steps.candidate-state.outputs.status == 'PREPARED'
        run: python3 -m scripts.ci.redroid_prepare_apps --root work/runtime-smoke --candidate work/runtime-smoke/candidate-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-redroid-inputs-${{ steps.policy.outputs.app_id }}
          path: |
            work/runtime-smoke/${{ steps.policy.outputs.app_id }}.apk
            work/runtime-smoke/module/
            work/runtime-smoke/module-identity.json
            work/runtime-smoke/inputs.json
            work/runtime-smoke/candidate-report.json
            work/runtime-smoke/static-check.json
            work/runtime-smoke/apk-inputs/
            work/runtime-smoke/regression/
            work/runtime-smoke/qq-probe/
            work/runtime-smoke/ui-hierarchy.jar
          retention-days: 7
      - name: Upload candidate report for result validation
        uses: actions/upload-artifact@v7
        with:
          name: runtime-candidate-report-input-${{ steps.policy.outputs.app_id }}
          path: |
            work/runtime-smoke/candidate-report.json
            work/runtime-smoke/static-check.json
            work/runtime-smoke/apk-inputs/
            work/runtime-smoke/regression/
            work/runtime-smoke/module/app-debug.apk
          retention-days: 7
      - name: Export preparation badge evidence
        id: badge-evidence
        if: always()
        env:
          MODULE_BUILD_OUTCOME: ${{ steps.module-build.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from scripts.ci.build_badge import gradle_failure_outcome
          from scripts.ci.compatibility_badge import (
              classify_regression, classify_regression_check,
          )

          candidate_path = Path('work/runtime-smoke/candidate-report.json')
          candidate = json.loads(candidate_path.read_text()) if candidate_path.is_file() else {}
          identity = candidate.get('identity') if isinstance(candidate.get('identity'), dict) else {}
          candidate_status = candidate.get('status')
          diagnostic = candidate.get('diagnostic')
          selection = diagnostic.get('selection') if isinstance(diagnostic, dict) else None
          regression_path = Path('work/runtime-smoke/regression/results.json')
          regression = json.loads(regression_path.read_text()) if regression_path.is_file() else {}
          regression_outcome = classify_regression(regression)
          check_outcome = ('FAILED' if classify_regression_check(regression) == 'FAILED'
                           else 'PASSED' if candidate_status == 'PREPARED'
                           or selection in {'NO_MATCH', 'CONFLICT'} else 'UNKNOWN')
          build_outcome = 'PASSED' if os.environ.get('MODULE_BUILD_OUTCOME') == 'success' else 'UNKNOWN'
          evidence_path = Path('work/build-badge/gradle-failures.json')
          gradle = json.loads(evidence_path.read_text()) if evidence_path.is_file() else None
          gradle_outcome = gradle_failure_outcome(gradle)
          if gradle_outcome == 'build_failure':
              build_outcome = 'FAILED'
          elif gradle_outcome == 'check_failure':
              check_outcome = 'FAILED'
          outcome = ('REGRESSION_FAILED' if regression_outcome == 'FAILED'
                     else selection if selection in {'NO_MATCH', 'CONFLICT'}
                     else 'PENDING_RUNTIME' if candidate_status == 'PREPARED'
                     else 'ERROR')
          version = identity.get('versionName')
          if not isinstance(version, str) or not re.fullmatch(r'\d+(?:\.\d+){1,4}', version):
              version = ''
          version_code = identity.get('versionCode')
          if type(version_code) is not int or version_code <= 0:
              version_code = ''
          digest = identity.get('apkSha256', '')
          if not isinstance(digest, str) or not re.fullmatch(r'[0-9a-f]{64}', digest):
              digest = ''
          outputs = {
              'badge_outcome': outcome,
              'badge_candidate_status': candidate_status if candidate_status in {'PREPARED', 'INCOMPATIBLE'} else 'UNAVAILABLE',
              'badge_version_name': version, 'badge_version_code': version_code,
              'badge_candidate_sha256': digest, 'badge_regression_outcome': regression_outcome,
              'badge_check_outcome': check_outcome, 'badge_build_outcome': build_outcome,
              'badge_runtime_environment': 'UNKNOWN',
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              for key, value in outputs.items():
                  output.write(f'{key}={value}\n')
          PY

  smoke:
    needs: prepare
    if: needs.prepare.outputs.candidate_status == 'PREPARED'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    outputs:
      probe_conclusion: ${{ steps.probe.outcome }}
    env:
      IMPAD_ADB_BINARY: /usr/bin/adb
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: runtime-redroid-inputs-${{ needs.prepare.outputs.app_id }}
          path: work/runtime-smoke
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends adb kmod tesseract-ocr 7zip
      - name: Independently verify the exact candidate on native ReDroid
        id: probe
        continue-on-error: ${{ inputs.operation == 'adapt' }}
        run: python3 -m scripts.ci.redroid_environment_probe --output work/runtime-smoke --app-inputs work/runtime-smoke
      - name: Package stable runtime evidence layout
        if: always()
        run: |
          mkdir -p work/runtime-artifact/runtime-smoke
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          source = Path('work/runtime-smoke')
          target = Path('work/runtime-artifact/runtime-smoke')
          for name in ('evidence', 'apps'):
              if (source / name).is_dir():
                  shutil.copytree(source / name, target / name, dirs_exist_ok=True)
          for path in list(source.glob('*.txt')) + [source / name for name in ('report.json', 'app-reports.json', 'memory-samples.json', 'summary.md')]:
              if path.is_file():
                  shutil.copyfile(path, target / path.name)
          for name in ('tooling-report.json', 'app-launch-steps.jsonl'):
              if (source / 'tooling' / name).is_file():
                  (target / 'tooling').mkdir(exist_ok=True)
                  shutil.copyfile(source / 'tooling' / name, target / 'tooling' / name)
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-smoke
          path: work/runtime-artifact/
          retention-days: 14
      - if: always()
        run: |
          if [ -f work/runtime-smoke/summary.md ]; then
            cat work/runtime-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  result:
    needs: [prepare, smoke]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      validation_outcome: ${{ steps.verdict.outputs.outcome }}
      adaptation_artifact: ${{ steps.verdict.outputs.adaptation_artifact }}
      badge_outcome: ${{ steps.verdict.outputs.badge_outcome }}
      badge_candidate_status: ${{ steps.verdict.outputs.badge_candidate_status }}
      badge_version_name: ${{ steps.verdict.outputs.badge_version_name }}
      badge_version_code: ${{ steps.verdict.outputs.badge_version_code }}
      badge_candidate_sha256: ${{ steps.verdict.outputs.badge_candidate_sha256 }}
      badge_regression_outcome: ${{ steps.verdict.outputs.badge_regression_outcome }}
      badge_check_outcome: ${{ steps.verdict.outputs.badge_check_outcome }}
      badge_build_outcome: ${{ steps.verdict.outputs.badge_build_outcome }}
      badge_runtime_environment: ${{ steps.verdict.outputs.badge_runtime_environment }}
    env:
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
      CANDIDATE_STATUS: ${{ needs.prepare.outputs.candidate_status }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_head || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: runtime-candidate-report-input-${{ needs.prepare.outputs.app_id }}
          path: runtime-result
      - uses: actions/download-artifact@v8
        if: needs.prepare.outputs.candidate_status == 'PREPARED'
        continue-on-error: true
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-smoke
          path: runtime-result/evidence
      - name: Validate pipeline acceptance without publishing support
        id: verdict
        env:
          SMOKE_CONCLUSION: ${{ needs.smoke.outputs.probe_conclusion || needs.smoke.result }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          directory = Path('runtime-result')
          if os.environ.get('CANDIDATE_STATUS') != 'PREPARED':
              candidate = {}
              candidate_path = directory / 'candidate-report.json'
              if candidate_path.is_file():
                  candidate = json.loads(candidate_path.read_text())
              report = {'schemaVersion': 1, 'outcome': 'INCOMPATIBLE',
                        'failedStage': 'static', 'candidate': candidate,
                        'diagnostics': ['The shared rule checker did not produce a unique plan.']}
              (directory / 'runtime-candidate-report.json').write_text(json.dumps(report, indent=2) + '\n')
              from scripts.ci.compatibility_badge import write_runtime_summary
              regression_path = directory / 'regression/results.json'
              regression = json.loads(regression_path.read_text()) if regression_path.is_file() else None
              write_runtime_summary(candidate, None, regression,
                                    directory / 'compatibility-badge-summary.json',
                                    os.environ.get('GITHUB_OUTPUT'))
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write('## Runtime validation result\n\n`INCOMPATIBLE`\n\n')
                  summary.write('No model, PR, device run, or acceptance write was started.\n')
              expected_handoff = (os.environ.get('OPERATION') == 'adapt'
                                  and os.environ.get('CANDIDATE_STATUS') == 'INCOMPATIBLE')
              if os.environ.get('GITHUB_OUTPUT'):
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                      output.write('outcome=INCOMPATIBLE\n')
              raise SystemExit(0 if expected_handoff else 1)
          evidence_root = directory / 'evidence/runtime-smoke'
          smoke_report = evidence_root / 'evidence/smoke-report.json'
          acceptance_path = Path(f"compatibility/{os.environ['APP_ID']}/acceptance.json")
          if not acceptance_path.is_file():
              raise FileNotFoundError(f'Acceptance table is missing: {acceptance_path}')
          candidate_path = directory / 'candidate-report.json'
          candidate = json.loads(candidate_path.read_text())
          if candidate.get('schemaVersion') != 2 or candidate.get('status') != 'PREPARED':
              raise ValueError('Runtime verifier requires a prepared schema2 candidate')
          static_path = (candidate_path.parent / candidate['staticReport']).resolve()
          if not static_path.is_relative_to(candidate_path.parent.resolve()):
              raise ValueError('Static checker report escapes the candidate artifact root')
          static = json.loads(static_path.read_text())
          if static.get('schemaVersion') != 2 or static.get('analysisScope') != 'APK_FILE_SNAPSHOT':
              raise ValueError('Runtime verifier requires a schema2 APK file snapshot report')
          selection = static.get('selection', {})
          if (selection.get('status') != 'SELECTED' or not isinstance(selection.get('plan'), dict)
                  or selection['plan'] != candidate.get('expectedPlan')
                  or selection.get('executionSha256') != candidate.get('expectedExecutionSha256')):
              raise ValueError('Runtime candidate does not match the selected schema2 complete plan')
          if not smoke_report.is_file():
              smoke_report.parent.mkdir(parents=True, exist_ok=True)
              smoke_report.write_text(json.dumps({'status': 'ACCEPTANCE_UNAVAILABLE', 'reason': 'Runtime report artifact is missing'}) + '\n')
          command = [sys.executable, '-m', 'scripts.ci.runtime_task', 'verify',
                     '--app-id', os.environ['APP_ID'],
                     '--candidate', str(directory / 'candidate-report.json'),
                     '--module-apk', str(directory / 'module/app-debug.apk'),
                     '--regression', str(directory / 'regression/results.json'),
                     '--smoke', str(smoke_report), '--evidence-root', str(evidence_root),
                     '--acceptance', f"compatibility/{os.environ['APP_ID']}/acceptance.json",
                     '--repository', '.', '--conclusion', os.environ['SMOKE_CONCLUSION'],
                     '--output', str(directory / 'runtime-candidate-report.json')]
          subprocess.run(command, check=True)
          report = json.loads((directory / 'runtime-candidate-report.json').read_text())
          from scripts.ci.runtime_task import export_runtime_adaptation
          handoff = export_runtime_adaptation(
              directory / 'runtime-candidate-report.json', directory / 'candidate-report.json',
              evidence_root, os.environ['OPERATION'])
          from scripts.ci.compatibility_badge import write_runtime_summary
          regression_path = directory / 'regression/results.json'
          regression = json.loads(regression_path.read_text()) if regression_path.is_file() else None
          write_runtime_summary(candidate, report, regression,
                                directory / 'compatibility-badge-summary.json',
                                os.environ.get('GITHUB_OUTPUT'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"outcome={report['outcome']}\n")
              if handoff:
                  output.write(f"adaptation_artifact=runtime-adaptation-input-{os.environ['APP_ID']}\n")
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(f'## Runtime validation result\n\n`{report.get("outcome", report.get("status"))}`\n\n')
              summary.write('Validation did not write the formal acceptance table or publish support.\n')
          assert handoff or report.get('outcome', report.get('status')) in {'VERIFIED', 'RUNTIME_VERIFIED'}, report
          PY
      - name: Export confirmed runtime failure for adaptation
        if: steps.verdict.outputs.adaptation_artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.verdict.outputs.adaptation_artifact }}
          path: runtime-result/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-result
          path: runtime-result/runtime-candidate-report.json
          retention-days: 14
