name: Probe hosted Android environments

on:
  workflow_dispatch:
  push:
    branches: [codex/qq-sigbus-diagnostic]
    paths:
      - .github/workflows/runner-environment-probe.yml
      - scripts/ci/runner_environment_probe.py
      - scripts/ci/stock_avd_apps_probe.py

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux Emulator runtime libraries
        if: matrix.runner == 'ubuntu-24.04'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcb1 libxkbcommon0 libglu1-mesa
      - name: Inspect host and official native Emulator
        run: python scripts/ci/runner_environment_probe.py --output work/runner-probe
      - uses: actions/setup-java@v6
        if: matrix.runner != 'ubuntu-24.04-arm' && matrix.runner != 'windows-11-arm'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: matrix.runner != 'ubuntu-24.04-arm' && matrix.runner != 'windows-11-arm'
        with:
          packages: ''
      - name: Boot stock API 31 and observe official apps
        if: matrix.runner != 'ubuntu-24.04-arm' && matrix.runner != 'windows-11-arm'
        run: python -m scripts.ci.stock_avd_apps_probe
      - name: Upload environment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-probe-${{ matrix.runner }}
          path: |
            work/runner-probe/report.json
            work/runner-probe/summary.md
            work/runner-probe/accel-check.txt
            work/runner-probe/repository.xml
            work/runner-probe/system-images.xml
            work/runner-probe/stock-avd/
          retention-days: 7

  summary:
    name: Summarize environment probes
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: runner-probe-*
          path: evidence
      - name: Combine reports
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Runner | Host | Emulator | Acceleration | AVD boot |\n|---|---|---|---|---|\n')
              reports = sorted(Path('evidence').glob('*/report.json'))
              for path in reports:
                  r = json.loads(path.read_text())
                  emulator = r.get('officialEmulator') or {}
                  host = r['host']
                  summary.write(f"| {r['runner']} | {host['system']} {host['machine']} | {emulator.get('version', 'none')} | {r['acceleration']} | {r['avdBoot']} |\n")
                  if r.get('error'):
                      summary.write(f"\n{r['runner']}: {r['error']}\n")
              summary.write('\nAcceleration detection does not establish successful AVD boot or application compatibility.\n')
          PY
