name: Publish main build badge

on:
  workflow_run:
    workflows: ['Build module APK']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: impad-main-build-badge
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'NKU100/ImPad' &&
      github.event.workflow_run.path == '.github/workflows/build.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'NKU100/ImPad'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Download build evidence without executing it
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: impad-build-badge
          path: work/build-badge-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish terminal badge state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_EVENT_PATH: ${{ github.event_path }}
        run: python3 -m scripts.ci.build_badge publish --event "$GH_EVENT_PATH" --artifact-directory work/build-badge-input
