name: Run app compatibility pipeline

on:
  workflow_call:
    inputs:
      app_id:
        description: Registered application policy
        type: string
        required: true
      operation:
        description: Verify only or adapt an incompatible candidate
        type: string
        default: verify
      apk_url:
        description: Exact HTTPS APK or XAPK URL with trusted app signature; empty uses official discovery
        type: string
        default: ''
      module_run_id:
        description: Optional build run containing the exact module artifact to verify
        type: string
        default: ''
      module_artifact:
        description: Optional artifact name in module_run_id; empty keeps the runtime default
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: impad-compatibility-${{ inputs.app_id }}-${{ inputs.operation == 'adapt' && 'adapt' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Validate exact requested application candidate
    if: inputs.operation == 'verify'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-validation.yml
    with:
      app_id: ${{ inputs.app_id }}
      operation: verify
      apk_url: ${{ inputs.apk_url || '' }}
      module_run_id: ${{ inputs.module_run_id || '' }}
      module_artifact: ${{ inputs.module_artifact || '' }}
      candidate_mode: latest

  prepare:
    if: inputs.operation == 'adapt'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ inputs.app_id }}
    outputs:
      app_id: ${{ steps.policy.outputs.app_id }}
      artifact_prefix: ${{ steps.policy.outputs.artifact_prefix }}
      adaptation_prompt: ${{ steps.policy.outputs.adaptation_prompt }}
      pending_adaptation: ${{ steps.pending-adaptation.outputs.pending_adaptation }}
      pending_issue: ${{ steps.pending-adaptation.outputs.pending_issue }}
      pending_candidate_key: ${{ steps.pending-adaptation.outputs.pending_candidate_key }}
      pending_checkpoint_run_id: ${{ steps.pending-adaptation.outputs.pending_checkpoint_run_id }}
      pending_checkpoint_artifact: ${{ steps.pending-adaptation.outputs.pending_checkpoint_artifact }}
    permissions:
      contents: read
      issues: read
    steps:
      - name: Validate requested operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: test "$OPERATION" = adapt
      - name: Check out source
        uses: actions/checkout@v7
      - name: Resolve trusted application policy
        id: policy
        run: python3 -m scripts.ci.app_policy --app-id "$APP_ID" --github-output "$GITHUB_OUTPUT"
      - name: Find the oldest unfinished adaptation for this app
        id: pending-adaptation
        if: inputs.apk_url == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.codex_task pending --app-id "$APP_ID" --directory "$RUNNER_TEMP"
      - name: Test app discovery, shared candidate preparation, and policy isolation
        run: |
          case "$APP_ID" in
            wechat) discovery_test=scripts.test_discover_latest_wechat ;;
            wecom) discovery_test=scripts.test_wecom_discovery_policy ;;
            qq) discovery_test=scripts.test_qq_policy ;;
            *) exit 2 ;;
          esac
          python3 -m unittest "$discovery_test" scripts.test_candidate_selection scripts.test_app_policy scripts.test_codex_adaptation scripts.test_adaptation_checkpoint scripts.test_codex_task scripts.test_runtime_adaptation scripts.test_runtime_task scripts.test_static_regression

  rules-analysis:
    name: Analyze exact candidate with the shared checker
    needs: prepare
    if: inputs.operation == 'adapt' && needs.prepare.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-validation.yml
    with:
      app_id: ${{ needs.prepare.outputs.app_id }}
      operation: adapt
      apk_url: ${{ inputs.apk_url || '' }}
      candidate_mode: latest

  adapt:
    name: Adapt unknown build with Codex
    concurrency:
      group: impad-codex-managed-auth
      cancel-in-progress: false
      queue: max
    needs: [prepare, rules-analysis]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      inputs.operation == 'adapt' && needs.prepare.result == 'success' &&
      ((needs.rules-analysis.result == 'success' &&
        (needs.rules-analysis.outputs.candidate_status == 'INCOMPATIBLE' ||
         needs.rules-analysis.outputs.validation_outcome == 'RUNTIME_INCOMPATIBLE')) ||
       needs.prepare.outputs.pending_adaptation == 'true')
    runs-on: ubuntu-24.04-arm
    environment: codex-managed-auth
    outputs:
      pipeline_status: ${{ steps.publish.outputs.pipeline_status || steps.adaptation-failure.outputs.pipeline_status }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
      head_sha: ${{ steps.publish.outputs.head_sha }}
      candidate_ready: ${{ steps.candidate-ready.outputs.ready }}
      issue: ${{ steps.checkpoint-pointer.outputs.issue || steps.interruption-result.outputs.issue || steps.claim.outputs.issue }}
      consumed_comment_id: ${{ steps.checkpoint-pointer.outputs.consumed_comment_id }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      IMPAD_ADB_BINARY: /usr/bin/adb
      PYTHONDONTWRITEBYTECODE: '1'
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
      ADAPTATION_PROMPT: ${{ needs.prepare.outputs.adaptation_prompt }}
    steps:
      - name: Check out trusted DexKit preparation source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .trusted-dexkit
          sparse-checkout: |
            .github/actions/prepare-dexkit-system-deps
            scripts/ci
            gradle
          persist-credentials: false

      - name: Prepare locked DexKit system dependencies
        uses: ./.trusted-dexkit/.github/actions/prepare-dexkit-system-deps

      - name: Check out trusted pipeline source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted trigger and authentication configuration
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_CHECKPOINT_RECIPIENT: ${{ vars.CODEX_CHECKPOINT_RECIPIENT }}
          CODEX_CHECKPOINT_IDENTITY: ${{ secrets.CODEX_CHECKPOINT_IDENTITY }}
          CODEX_TRACE_RECIPIENT: ${{ vars.CODEX_TRACE_RECIPIENT }}
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' && ( "$GITHUB_EVENT_NAME" == 'workflow_dispatch' || "$GITHUB_EVENT_NAME" == 'schedule' ) ]] || { echo 'Managed authentication requires a main-branch manual or scheduled run.'; exit 1; }
          [[ -n "$CODEX_AUTH_JSON" && -n "$GH_TOKEN" ]] || { echo 'Configure CODEX_AUTH_JSON and CODEX_AUTH_WRITE_TOKEN before starting Codex.'; exit 1; }
          [[ -n "$CODEX_CHECKPOINT_IDENTITY" && -n "$CODEX_CHECKPOINT_RECIPIENT" ]] || { echo 'Configure matching CODEX_CHECKPOINT_IDENTITY secret and CODEX_CHECKPOINT_RECIPIENT variable.'; exit 1; }
          [[ -n "$CODEX_TRACE_RECIPIENT" ]] || { echo 'Configure the CODEX_TRACE_RECIPIENT Actions variable before starting Codex.'; exit 1; }
          if ! environment_secret="$(gh api "repos/$GITHUB_REPOSITORY/environments/codex-managed-auth/secrets/CODEX_AUTH_JSON")"; then
            echo 'Environment secret CODEX_AUTH_JSON must exist and be readable in codex-managed-auth; repository-level secrets are not a fallback. CODEX_AUTH_WRITE_TOKEN needs Environments read access to verify it.' >&2
            exit 1
          fi
          [[ "$(jq -r '.name // empty' <<< "$environment_secret")" == CODEX_AUTH_JSON ]] || { echo 'Configure CODEX_AUTH_JSON as a secret in the codex-managed-auth environment.'; exit 1; }
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/codex-managed-auth/secrets/public-key" >/dev/null; then
            echo 'CODEX_AUTH_WRITE_TOKEN must have Environments read/write access to manage codex-managed-auth secrets; repository Secrets write permission is insufficient.' >&2
            exit 1
          fi

      - name: Download the exact candidate bundle
        if: inputs.operation == 'adapt' && needs.rules-analysis.outputs.candidate_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.rules-analysis.outputs.candidate_artifact }}
          path: compatibility-report

      - name: Freeze adaptation controller outside agent checkout
        run: |
          CONTROLLER_ROOT="$RUNNER_TEMP/impad-trusted"
          CODEX_TASK_DIR="$RUNNER_TEMP/impad-adaptation"
          mkdir -p "$CONTROLLER_ROOT" "$CODEX_TASK_DIR"
          {
            echo "CONTROLLER_ROOT=$CONTROLLER_ROOT"
            echo "CODEX_TASK_DIR=$CODEX_TASK_DIR"
            echo "PYTHONPATH=$CONTROLLER_ROOT"
          } >> "$GITHUB_ENV"
          cp -R scripts "$CONTROLLER_ROOT/scripts"
          cp "$ADAPTATION_PROMPT" "$CONTROLLER_ROOT/adapt-prompt.md"
          echo "ADAPTATION_PROMPT=$CONTROLLER_ROOT/adapt-prompt.md" >> "$GITHUB_ENV"

      - name: Match the latest APK to the unfinished adaptation
        id: candidate-checkpoint
        if: >-
          needs.prepare.outputs.pending_adaptation != 'true' && needs.prepare.outputs.pending_candidate_key != '' &&
          (needs.rules-analysis.outputs.candidate_status == 'INCOMPATIBLE' ||
           needs.rules-analysis.outputs.validation_outcome == 'RUNTIME_INCOMPATIBLE')
        env:
          PENDING_CANDIDATE_KEY: ${{ needs.prepare.outputs.pending_candidate_key }}
          CANDIDATE_REPORT: ${{ github.workspace }}/compatibility-report/candidate-report.json
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.ci.codex_task import candidate_matches_checkpoint

          matches = candidate_matches_checkpoint(
              os.environ['CANDIDATE_REPORT'], os.environ['PENDING_CANDIDATE_KEY'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f"same_candidate={str(matches).lower()}\n")
          PY

      - name: Download the active candidate checkpoint
        if: >-
          needs.prepare.outputs.pending_checkpoint_run_id != '' &&
          ((needs.prepare.outputs.pending_adaptation == 'true') ||
           (steps.candidate-checkpoint.outputs.same_candidate == 'true'))
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.prepare.outputs.pending_checkpoint_artifact }}
          path: ${{ runner.temp }}/impad-checkpoint
          run-id: ${{ needs.prepare.outputs.pending_checkpoint_run_id }}
          github-token: ${{ github.token }}

      - name: Select the report pinned by the unfinished adaptation
        id: selected-candidate
        env:
          PENDING_ADAPTATION: ${{ needs.prepare.outputs.pending_adaptation }}
          PENDING_CANDIDATE_KEY: ${{ needs.prepare.outputs.pending_candidate_key }}
          SAME_CANDIDATE: ${{ steps.candidate-checkpoint.outputs.same_candidate }}
        run: |
          cd "$CONTROLLER_ROOT"
          candidate_key=""
          if [[ "$PENDING_ADAPTATION" == 'true' || "$SAME_CANDIDATE" == 'true' ]]; then candidate_key="$PENDING_CANDIDATE_KEY"; fi
          python3 -m scripts.ci.codex_task select-report --app-id "$APP_ID" \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --checkpoint-directory "$RUNNER_TEMP/impad-checkpoint" \
            --candidate-key "$candidate_key" \
            --output-report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --directory "$CODEX_TASK_DIR"

      - name: Claim or resume the pinned adaptation
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task claim --app-id "$APP_ID" \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --repository "$GITHUB_WORKSPACE" \
            --directory "$CODEX_TASK_DIR"

      - name: Set up JDK 21
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        if: steps.claim.outputs.claimed == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare static validation dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: |
          export WECHATPAD_DEBUG_KEYSTORE="$RUNNER_TEMP/wechatpad-debug.keystore"
          keytool -genkeypair -keystore "$WECHATPAD_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          echo "WECHATPAD_DEBUG_KEYSTORE=$WECHATPAD_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          bash scripts/ci/prepare_arm64_sdk_host.sh
          sdkmanager 'cmdline-tools;latest' 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          ./gradlew --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :compat-core:test :compat-checker:test :app:assembleDebug

      - name: Set up Node.js
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prepare Linux sandbox prerequisites
        if: steps.claim.outputs.claimed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # The restrictive example AppArmor profile strips capabilities needed by nested sandboxes.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v bwrap
          bwrap --version
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc -- \
            bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc -- true

      - name: Install pinned Codex CLI, JADX and DexSQL
        if: steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.162.0-alpha.17.2
          npm install --prefix "$CONTROLLER_ROOT" --ignore-scripts @actions/artifact@6.3.1
          sudo apt-get update
          sudo apt-get install --yes age
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/jadx.zip" \
            https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          printf '%s  %s\n' 545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974 "$RUNNER_TEMP/jadx.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          mv "$RUNNER_TEMP/jadx/bin/jadx" "$RUNNER_TEMP/jadx/bin/jadx.real"
          install -m 0755 "$CONTROLLER_ROOT/scripts/ci/jadx-serial.sh" "$RUNNER_TEMP/jadx/bin/jadx"
          echo "$RUNNER_TEMP/jadx/bin" >> "$GITHUB_PATH"
          python3 -m unittest scripts.test_jadx_launcher
          python3 -m scripts.ci.install_dexsql --output "$RUNNER_TEMP/dexsql"
          echo "$RUNNER_TEMP/dexsql/bin" >> "$GITHUB_PATH"
          python3 -m unittest scripts.test_dexsql
          "$RUNNER_TEMP/dexsql/bin/dexsql" -t 2 query \
            --input app/build/outputs/apk/debug/app-debug.apk \
            --sql 'SELECT COUNT(*) AS classes FROM classes' \
            --sql 'SELECT COUNT(*) AS methods FROM methods' \
            --sql 'SELECT method, value FROM method_strings LIMIT 1' \
            --sql 'SELECT method, callee FROM method_calls LIMIT 1' --timing

      - name: Restore verified candidate cache
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.selected-candidate.outputs.cache_dir }}
          key: ${{ steps.selected-candidate.outputs.cache_key }}

      - name: Restore regression APK cache
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/${{ needs.prepare.outputs.app_id }}-apks
          key: impad-${{ needs.prepare.outputs.app_id }}-regression-${{ hashFiles(format('compatibility/{0}/acceptance.json', needs.prepare.outputs.app_id), 'compat-rules/src/main/**') }}
          restore-keys: impad-${{ needs.prepare.outputs.app_id }}-regression-

      - name: Revalidate candidate cache and prepare isolated checkout
        id: prepare-checkout
        if: steps.claim.outputs.claimed == 'true'
        env:
          WECHAT_APK_CACHE_DIR: ${{ steps.selected-candidate.outputs.cache_dir }}
        run: |
          set -euo pipefail
          expected_sha256="$(jq -r .identity.apkSha256 compatibility-report/candidate-report.json)"
          python3 - <<'PYDOWNLOAD'
          import json, os
          from pathlib import Path
          from scripts.ci.candidate_selection import revalidate_candidate_download
          report = json.loads(Path('compatibility-report/candidate-report.json').read_text())
          revalidate_candidate_download(report, Path(os.environ['WECHAT_APK_CACHE_DIR']))
          PYDOWNLOAD
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_adaptation --app-id "$APP_ID" prepare \
            --repository "$GITHUB_WORKSPACE" \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json" \
            --apk "$GITHUB_WORKSPACE/$WECHAT_APK_CACHE_DIR/$expected_sha256.apk" \
            --directory "$CODEX_TASK_DIR"

      - name: Restore candidate checkpoint and session handoff
        id: restore-checkpoint
        if: steps.claim.outputs.claimed == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/impad-codex-auth
          CODEX_CHECKPOINT_IDENTITY: ${{ secrets.CODEX_CHECKPOINT_IDENTITY }}
          CODEX_CHECKPOINT_RECIPIENT: ${{ vars.CODEX_CHECKPOINT_RECIPIENT }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.adaptation_checkpoint restore \
            --directory "$CODEX_TASK_DIR" \
            --checkpoint-directory "$RUNNER_TEMP/impad-checkpoint"

      - name: Restore dedicated managed account authentication
        if: steps.claim.outputs.claimed == 'true' && steps.restore-checkpoint.outputs.needs_model == 'true'
        id: restore-auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/impad-codex-auth
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          auth = json.loads(os.environ['CODEX_AUTH_JSON'])
          if auth.get('auth_mode') != 'chatgpt' or not auth.get('tokens', {}).get('refresh_token'):
              raise SystemExit('CODEX_AUTH_JSON must contain dedicated managed ChatGPT authentication.')
          home = Path(os.environ['CODEX_HOME'])
          home.mkdir(mode=0o700, exist_ok=True)
          path = home / 'auth.json'
          path.touch(mode=0o600)
          path.write_text(json.dumps(auth))
          PY

      - name: Prepare native ReDroid inputs for adaptation
        if: steps.claim.outputs.claimed == 'true' && steps.restore-checkpoint.outputs.needs_model == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/runtime-smoke/evidence work/runtime-smoke/module
          cp app/build/outputs/apk/debug/app-debug.apk work/runtime-smoke/module/app-debug.apk
          candidate_sha256="$(jq -r .identity.apkSha256 "$CODEX_TASK_DIR/checkout/work/analysis/candidate-report.json")"
          cp "$CODEX_TASK_DIR/checkout/work/apks/candidate-${candidate_sha256}.apk" "work/runtime-smoke/${APP_ID}.apk"
          sudo apt-get install -y --no-install-recommends adb kmod tesseract-ocr 7zip
          python3 -m scripts.ci.redroid_prepare_apps --root work/runtime-smoke --tools-only

      - name: Expose masked artifact transport credentials to trusted controller
        if: steps.claim.outputs.claimed == 'true' && steps.restore-checkpoint.outputs.needs_model == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing artifact transport environment: ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Adapt through a verified Codex goal with disposable ReDroid
        id: adaptation
        if: steps.claim.outputs.claimed == 'true' && steps.restore-checkpoint.outputs.needs_model == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/impad-codex-auth
          CODEX_TRACE_RECIPIENT: ${{ vars.CODEX_TRACE_RECIPIENT }}
          CODEX_CHECKPOINT_RECIPIENT: ${{ vars.CODEX_CHECKPOINT_RECIPIENT }}
          CODEX_CHECKPOINT_IDENTITY: ${{ secrets.CODEX_CHECKPOINT_IDENTITY }}
          GH_TOKEN: ${{ github.token }}
          ADAPTATION_ISSUE: ${{ steps.claim.outputs.issue }}
        run: |
          python3 -m scripts.ci.redroid_adaptation \
            --directory "$CODEX_TASK_DIR" --root "$GITHUB_WORKSPACE/work/runtime-smoke" \
            --controller "$CONTROLLER_ROOT"

      - name: Persist refreshed authentication even after model failure
        if: always() && steps.restore-auth.outcome == 'success'
        id: persist-auth
        env:
          CODEX_HOME: ${{ runner.temp }}/impad-codex-auth
          GH_TOKEN: ${{ secrets.CODEX_AUTH_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh secret set CODEX_AUTH_JSON --repo "$GITHUB_REPOSITORY" --env codex-managed-auth < "$CODEX_HOME/auth.json"

      - name: Remove runner authentication before validation
        if: always() && steps.restore-auth.outcome == 'success'
        env:
          CODEX_HOME: ${{ runner.temp }}/impad-codex-auth
        run: rm -f "$CODEX_HOME/auth.json"

      - name: Validate adaptation through shared checker and build
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_adaptation --app-id "$APP_ID" validate --directory "$CODEX_TASK_DIR"

      - name: Export validated runtime inputs
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        run: |
          python3 - <<'PYEXPORT'
          import json, os, shutil
          from pathlib import Path
          task = Path(os.environ['CODEX_TASK_DIR'])
          checkout = Path(json.loads((task / 'state.json').read_text())['worktree'])
          destination = Path('runtime-inputs')
          destination.mkdir()
          shutil.copyfile(checkout / 'app/build/outputs/apk/debug/app-debug.apk', destination / 'app-debug.apk')
          report = json.loads((checkout / 'work/analysis/candidate-report.json').read_text())
          digest = report['identity']['apkSha256']
          shutil.copyfile(checkout / 'work/apks' / f'candidate-{digest}.apk', destination / f"{os.environ['APP_ID']}-{digest}.apk")
          shutil.copyfile(task / 'candidate-report.json', destination / 'candidate-report.json')
          from scripts.ci.apk_inputs import resolve_apk_inputs
          for item, source in zip(report['apkFiles'], resolve_apk_inputs(report, checkout / 'work/analysis')):
              target = destination / item['path']
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PYEXPORT

      - name: Upload validated module APK
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-adapted-module
          path: runtime-inputs/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified runtime candidate
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-candidate
          path: |
            runtime-inputs/${{ needs.prepare.outputs.app_id }}-*.apk
            runtime-inputs/candidate-report.json
            runtime-inputs/apk-inputs/
          if-no-files-found: error
          retention-days: 7

      - name: Mark exact module and candidate artifacts ready for runtime
        id: candidate-ready
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish statically verified draft PR
        if: >-
          success() && steps.claim.outputs.claimed == 'true' &&
          (steps.restore-checkpoint.outputs.needs_model == 'false' || steps.adaptation.outputs.adaptation_ready == 'true')
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task publish \
            --directory "$CODEX_TASK_DIR" --app-id "$APP_ID" --issue '${{ steps.claim.outputs.issue }}'

      - name: Record adaptation handoff for the next run
        if: always() && steps.claim.outputs.claimed == 'true' && steps.publish.outputs.pr_url == ''
        id: adaptation-failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task fail \
            --directory "$CODEX_TASK_DIR" --app-id "$APP_ID" --issue '${{ steps.claim.outputs.issue }}' \
            --report "$GITHUB_WORKSPACE/compatibility-report/candidate-report.json"

      - name: Add adaptation result to summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.publish.outputs.pipeline_status || steps.adaptation-failure.outputs.pipeline_status }}
          ADAPTATION_PR: ${{ steps.publish.outputs.pr_url }}
          CLAIMED: ${{ steps.claim.outputs.claimed }}
          ISSUE_NUMBER: ${{ steps.claim.outputs.issue }}
          CHECKPOINT_WARNING: ${{ steps.restore-checkpoint.outputs.checkpoint_download_warning }}
        run: |
          {
            echo '## Codex adaptation'
            echo '- Model: gpt-6-luna; reasoning: xhigh; one goal; independent verification; no custom model timeout.'
            echo "- Status: ${PIPELINE_STATUS:-not started}"
            echo "- Claimed: ${CLAIMED:-false}; issue: ${ISSUE_NUMBER:-none}"
            [[ -z "$CHECKPOINT_WARNING" ]] || echo "- Checkpoint: $CHECKPOINT_WARNING"
            [[ -z "$ADAPTATION_PR" ]] || echo "- Draft PR: $ADAPTATION_PR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture resumable adaptation checkpoint
        id: capture-checkpoint
        if: always() && steps.claim.outputs.claimed == 'true' && steps.prepare-checkout.outcome == 'success' && steps.restore-checkpoint.outcome == 'success'
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.adaptation_checkpoint capture --directory "$CODEX_TASK_DIR" --last-published

      - name: Upload deterministic adaptation result
        id: checkpoint-artifact
        if: always() && steps.claim.outputs.claimed == 'true' && steps.capture-checkpoint.outputs.checkpoint_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-codex-adaptation
          path: |
            ${{ runner.temp }}/impad-adaptation/candidate-report.json
            ${{ runner.temp }}/impad-adaptation/adaptation.patch
            ${{ runner.temp }}/impad-adaptation/goal-diagnostics.json
            ${{ runner.temp }}/impad-adaptation/session.jsonl.age
            ${{ runner.temp }}/impad-adaptation/trace-chunks/*.age
            ${{ runner.temp }}/impad-adaptation/runtime-report.json
            ${{ runner.temp }}/impad-adaptation/checkpoint.json
            ${{ runner.temp }}/impad-adaptation/checkpoint.patch
            ${{ runner.temp }}/impad-adaptation/handoff.json
            ${{ runner.temp }}/impad-adaptation/native-session.tar.age
          if-no-files-found: warn
          retention-days: 90

      - name: Update issue with the latest checkpoint pointer
        id: checkpoint-pointer
        if: always() && steps.claim.outputs.claimed == 'true' && steps.checkpoint-artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task checkpoint --app-id "$APP_ID" \
            --report "$CODEX_TASK_DIR/candidate-report.json" \
            --directory "$CODEX_TASK_DIR" --issue '${{ steps.claim.outputs.issue }}'

      - name: Report interruption without a newly published checkpoint
        id: interruption-result
        if: always() && steps.claim.outputs.claimed == 'true' && steps.checkpoint-pointer.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$CONTROLLER_ROOT"
          python3 -m scripts.ci.codex_task outcome --app-id "$APP_ID" \
            --report "$CODEX_TASK_DIR/candidate-report.json" \
            --directory "$CODEX_TASK_DIR" --issue '${{ steps.claim.outputs.issue }}'

      - name: Upload adaptation ReDroid evidence
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-adaptation-redroid
          path: |
            work/runtime-smoke/prepare-evidence/
            work/runtime-smoke/iteration-*/
            work/runtime-smoke/framework/*.txt
            work/runtime-smoke/tooling/tooling-report.json
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Smoke adapted candidate on hosted ReDroid
    needs: [prepare, adapt, rules-analysis]
    if: always() && !cancelled() && needs.adapt.outputs.candidate_ready == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/runtime-validation.yml
    with:
      module_run_id: ${{ github.run_id }}
      app_id: ${{ needs.prepare.outputs.app_id }}
      operation: verify
      apk_url: ''
      candidate_mode: artifact
      module_artifact: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-adapted-module
      candidate_artifact: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-candidate
      source_head: ${{ needs.adapt.outputs.head_sha }}

  runtime-result:
    name: Record runtime acceptance
    outputs:
      pipeline_status: ${{ steps.record.outputs.pipeline_status }}
    needs: [prepare, adapt, runtime]
    if: always() && needs.adapt.outputs.candidate_ready == 'true'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the exact tested source tree for fingerprint revalidation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.adapt.outputs.head_sha }}
          path: tested
          persist-credentials: false
      - name: Download the exact candidate, module, and regression inputs
        uses: actions/download-artifact@v8
        with:
          name: runtime-candidate-report-input-${{ needs.prepare.outputs.app_id }}
          path: runtime-result/inputs
      - name: Download runtime evidence
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-smoke
          path: runtime-result/evidence
      - name: Download the pure runtime verification result
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-result
          path: runtime-result/verification
      - name: Record verified acceptance or rejection
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTATION_PR: ${{ needs.adapt.outputs.pr_url }}
          TESTED_HEAD: ${{ needs.adapt.outputs.head_sha }}
          RUNTIME_CONCLUSION: ${{ needs.runtime.result }}
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_CONCLUSION" != success || -z "$ADAPTATION_PR" || -z "$TESTED_HEAD" ]]; then
            verification=runtime-result/verification/runtime-candidate-report.json
            outcome=UNAVAILABLE
            [[ ! -f "$verification" ]] || outcome="$(jq -r '.outcome // "UNAVAILABLE"' "$verification")"
            echo "pipeline_status=$outcome" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runtime_smoke=runtime-result/evidence/runtime-smoke/evidence/smoke-report.json
          acceptance="${GITHUB_WORKSPACE}/tested/compatibility/${APP_ID}/acceptance.json"
          test -f "$acceptance"
          historical_acceptance="compatibility/${APP_ID}/acceptance.json"
          expected_acceptance_path="compatibility/${APP_ID}/acceptance-v2.json"
          git -C tested diff --quiet HEAD -- "$historical_acceptance"
          history_sha256_before="$(sha256sum "$acceptance" | cut -d' ' -f1)"
          python3 -m scripts.ci.runtime_task register \
            --app-id "$APP_ID" \
            --candidate runtime-result/inputs/candidate-report.json \
            --module-apk runtime-result/inputs/module/app-debug.apk \
            --regression runtime-result/inputs/regression/results.json \
            --smoke "$runtime_smoke" \
            --evidence-root runtime-result/evidence/runtime-smoke \
            --acceptance "$acceptance" \
            --repository tested \
            --conclusion "$RUNTIME_CONCLUSION" \
            --expected-head "$TESTED_HEAD" \
            --output runtime-result/registered.json
          test "$(sha256sum "$acceptance" | cut -d' ' -f1)" = "$history_sha256_before"
          git -C tested diff --quiet HEAD -- "$historical_acceptance"
          pr_state="$(gh pr view "$ADAPTATION_PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName,baseRefName,state)"
          test "$(jq -r .headRefOid <<< "$pr_state")" = "$TESTED_HEAD"
          test "$(jq -r .baseRefName <<< "$pr_state")" = main
          test "$(jq -r .state <<< "$pr_state")" = OPEN
          pr_branch="$(jq -r .headRefName <<< "$pr_state")"

          registered_acceptance_path="$expected_acceptance_path"
          mkdir -p runtime-result
          cat > runtime-result/validate-registered.py <<'PY'
          import argparse
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess
          import sys
          import uuid

          from scripts.ci.acceptance import (
              assert_evidence_archive_unchanged,
              read_semantic_acceptance_table,
          )

          parser = argparse.ArgumentParser()
          parser.add_argument('--app-id', required=True)
          parser.add_argument('--acceptance-path', required=True)
          parser.add_argument('--registered', type=Path, required=True)
          parser.add_argument('--stage-manifest', type=Path, required=True)
          parser.add_argument('--paths-nul', type=Path, required=True)
          parser.add_argument('--verify-index', action='store_true')
          parser.add_argument('--staged-nul', type=Path)
          args = parser.parse_args()

          repo_path = Path('tested')
          if repo_path.is_symlink():
              raise ValueError('Trusted tested checkout cannot be a symbolic link')
          repo = repo_path.resolve(strict=True)
          if not repo.is_dir():
              raise ValueError('Trusted tested checkout is not a directory')

          def safe_repo_file(relative):
              if (not isinstance(relative, str) or not relative or '\0' in relative
                      or '\\' in relative):
                  raise ValueError('Registered evidence path is malformed')
              try:
                  relative.encode('utf-8')
              except UnicodeEncodeError as error:
                  raise ValueError('Registered evidence path is not UTF-8 encodable') from error
              pure = PurePosixPath(relative)
              if (pure.is_absolute() or pure.as_posix() != relative
                      or any(part in ('', '.', '..') for part in pure.parts)):
                  raise ValueError('Registered evidence path is not canonical and repository-relative')
              current = repo
              for part in pure.parts:
                  current = current / part
                  if current.is_symlink():
                      raise ValueError('Registered evidence path contains a symbolic link')
              if not current.is_file():
                  raise ValueError('Registered evidence file is missing or not regular')
              current.resolve(strict=True).relative_to(repo)
              return current

          registered = json.loads(args.registered.read_text())
          if (not isinstance(registered, dict)
                  or set(registered) != {'schemaVersion', 'status', 'recordId', 'acceptancePath',
                                         'recordCount', 'evidencePaths', 'evidenceManifest'}
                  or type(registered.get('schemaVersion')) is not int
                  or registered['schemaVersion'] != 2
                  or registered.get('status') != 'REGISTERED'
                  or registered.get('acceptancePath') != args.acceptance_path
                  or type(registered.get('recordCount')) is not int
                  or registered['recordCount'] < 1):
              raise ValueError('Register output schema, status, or acceptance path is invalid')

          record_id = registered.get('recordId')
          try:
              if not isinstance(record_id, str) or str(uuid.UUID(record_id)) != record_id:
                  raise ValueError
          except (ValueError, AttributeError) as error:
              raise ValueError('Register output recordId is not a canonical UUID') from error

          table_file = safe_repo_file(args.acceptance_path)
          table_bytes = table_file.read_bytes()
          table = json.loads(table_bytes.decode('utf-8'))
          validated_table_bytes = read_semantic_acceptance_table(
              table_file, args.app_id, repository=repo)
          if validated_table_bytes != table_bytes:
              raise ValueError('Acceptance table changed while the registered result was validated')
          records = table.get('records') if isinstance(table, dict) else None
          if not isinstance(records, list):
              raise ValueError('Validated acceptance table does not contain a record list')
          if len(records) != registered['recordCount']:
              raise ValueError('Register output recordCount differs from the validated table')
          matches = [record for record in records if record.get('recordId') == record_id]
          if len(matches) != 1 or matches[0].get('status') != 'VERIFIED':
              raise ValueError('Registered VERIFIED record is missing or ambiguous in the v2 table')

          record = matches[0]
          archive = record.get('evidenceArchive')
          archive_root = f'compatibility/{args.app_id}/acceptance-evidence/{record_id}'
          if not isinstance(archive, dict) or archive.get('path') != archive_root:
              raise ValueError('Registered evidence archive does not match app and record UUID')
          manifest_ref = registered.get('evidenceManifest')
          if (not isinstance(manifest_ref, dict) or set(manifest_ref) != {'path', 'sha256'}
                  or manifest_ref.get('path') != archive.get('manifestPath')
                  or manifest_ref.get('sha256') != archive.get('manifestSha256')):
              raise ValueError('Register output manifest identity differs from the acceptance record')

          mappings = archive.get('files')
          if not isinstance(mappings, list) or not mappings:
              raise ValueError('Registered evidence archive has no file mappings')
          expected_paths = [item.get('path') for item in mappings] + [archive.get('manifestPath')]
          evidence_paths = registered.get('evidencePaths')
          if (not isinstance(evidence_paths, list) or not evidence_paths
                  or any(not isinstance(path, str) for path in evidence_paths)
                  or len(evidence_paths) != len(set(evidence_paths))
                  or evidence_paths != expected_paths):
              raise ValueError('Register evidencePaths differ from the ordered v2 archive mapping')
          for path in evidence_paths:
              if not path.startswith(archive_root + '/'):
                  raise ValueError('Registered evidence file is outside its record archive')
              safe_repo_file(path)

          assert_evidence_archive_unchanged(repo, archive)
          expected_digests = {args.acceptance_path: hashlib.sha256(table_bytes).hexdigest()}
          for item in mappings:
              path = item['path']
              if path in expected_digests:
                  raise ValueError('Registered archive path collides with the acceptance table')
              expected_digests[path] = item['sha256']
          manifest_path = archive['manifestPath']
          if manifest_path in expected_digests:
              raise ValueError('Registered manifest path collides with another staged file')
          expected_digests[manifest_path] = archive['manifestSha256']
          stage_manifest = {'paths': [args.acceptance_path, *evidence_paths],
                            'digests': expected_digests}

          if args.verify_index:
              if args.staged_nul is None:
                  raise ValueError('Staged path listing is required for index verification')
              staged_raw = args.staged_nul.read_bytes()
              staged = staged_raw[:-1].split(b'\0') if staged_raw.endswith(b'\0') else []
              staged_paths = [item.decode('utf-8') for item in staged]
              if (len(staged_paths) != len(set(staged_paths))
                      or set(staged_paths) != set(stage_manifest['paths'])):
                  raise ValueError('Staged paths are not exactly the v2 table and registered evidence')
              for path, expected_sha in expected_digests.items():
                  blob = subprocess.check_output(['git', '-C', 'tested', 'show', f':{path}'])
                  if hashlib.sha256(blob).hexdigest() != expected_sha:
                      raise ValueError(f'Staged index blob differs from verified bytes: {path}')
          else:
              args.stage_manifest.parent.mkdir(parents=True, exist_ok=True)
              args.stage_manifest.write_text(json.dumps(stage_manifest, sort_keys=True) + '\n')
              args.paths_nul.write_bytes(b''.join(path.encode('utf-8') + b'\0'
                                                  for path in evidence_paths))
          PY
          stage_manifest=runtime-result/registered-stage.json
          evidence_paths_nul=runtime-result/registered-evidence-paths.nul
          staged_paths_nul=runtime-result/staged-paths.nul
          python3 runtime-result/validate-registered.py \
            --app-id "$APP_ID" --acceptance-path "$expected_acceptance_path" \
            --registered runtime-result/registered.json \
            --stage-manifest "$stage_manifest" --paths-nul "$evidence_paths_nul"
          test "$(sha256sum "$acceptance" | cut -d' ' -f1)" = "$history_sha256_before"
          git -C tested diff --quiet HEAD -- "$historical_acceptance"
          stage_paths=("$registered_acceptance_path")
          while IFS= read -r -d '' evidence_path; do
            stage_paths+=("$evidence_path")
          done < "$evidence_paths_nul"
          git -C tested add -- "${stage_paths[@]}"
          git -C tested diff --cached --quiet -- "$registered_acceptance_path" && {
            echo 'Trusted registration produced no schema2 acceptance change' >&2
            exit 1
          }
          git -C tested diff --cached --name-only -z > "$staged_paths_nul"
          python3 runtime-result/validate-registered.py \
            --app-id "$APP_ID" --acceptance-path "$expected_acceptance_path" \
            --registered runtime-result/registered.json \
            --stage-manifest "$stage_manifest" --paths-nul "$evidence_paths_nul" \
            --verify-index --staged-nul "$staged_paths_nul"
          test "$(sha256sum "$acceptance" | cut -d' ' -f1)" = "$history_sha256_before"
          git -C tested diff --cached --quiet HEAD -- "$historical_acceptance"
          git -C tested config user.name 'github-actions[bot]'
          git -C tested config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tested commit -m "Record ${APP_ID} runtime acceptance"
          gh auth setup-git
          git -C tested push \
            "--force-with-lease=refs/heads/${pr_branch}:${TESTED_HEAD}" \
            origin "HEAD:refs/heads/${pr_branch}"
          gh pr ready "$ADAPTATION_PR" --repo "$GITHUB_REPOSITORY"
          echo 'pipeline_status=VERIFIED' >> "$GITHUB_OUTPUT"
      - name: Upload pipeline acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-${{ needs.prepare.outputs.app_id }}-runtime-result
          path: runtime-result/runtime-candidate-report.json
          retention-days: 14
          if-no-files-found: warn
