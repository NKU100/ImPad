name: Check QQ compatibility

on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force_recheck:
        description: Run static regression even when the exact APK is already supported
        type: boolean
        default: false
      run_codex:
        description: Adapt verified unknown builds with gpt-6-luna/xhigh
        type: boolean
        default: true
      baseline_apk_sha256:
        description: Select a runtime-verified baseline variant when the preferred version is ambiguous
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility-app.yml
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      app_id: qq
      force_recheck: ${{ inputs.force_recheck || false }}
      run_codex: ${{ github.event_name == 'schedule' || inputs.run_codex }}
      baseline_apk_sha256: ${{ inputs.baseline_apk_sha256 || '' }}
    secrets: inherit
