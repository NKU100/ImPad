name: Check QQ compatibility

on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Validate the requested candidate or adapt it when incompatible
        type: choice
        required: true
        default: verify
        options:
          - verify
          - adapt
      apk_url:
        description: Exact official QQ APK URL; empty uses official discovery
        type: string
        default: ''
      module_run_id:
        description: Optional build run containing the exact module artifact to verify
        type: string
        default: ''
      module_artifact:
        description: Optional artifact name in module_run_id; empty keeps the runtime default
        type: string
        default: ''
permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility-app.yml
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    with:
      app_id: qq
      operation: ${{ github.event_name == 'schedule' && 'adapt' || inputs.operation || 'verify' }}
      apk_url: ${{ inputs.apk_url || '' }}
      module_run_id: ${{ inputs.module_run_id || '' }}
      module_artifact: ${{ inputs.module_artifact || '' }}
    secrets: inherit
