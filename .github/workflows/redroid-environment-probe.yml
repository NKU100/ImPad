name: Probe hosted ReDroid framework

on:
  workflow_dispatch:
  push:
    branches: [codex/qq-sigbus-diagnostic]
    paths:
      - .github/workflows/redroid-environment-probe.yml
      - scripts/ci/redroid_environment_probe.py
      - scripts/ci/redroid/**

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends adb kmod
      - name: Boot pinned Android and verify CI framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.ci.redroid_environment_probe --output work/redroid-probe
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redroid-probe-${{ matrix.runner }}
          path: |
            work/redroid-probe/*.txt
            work/redroid-probe/report.json
            work/redroid-probe/summary.md
          retention-days: 7
      - name: Publish probe result
        if: always()
        run: |
          if [ -f work/redroid-probe/summary.md ]; then
            cat work/redroid-probe/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
